[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quant-lab"
version = "0.1.0"
description = "Inspect visible facts in a local market CSV fixture."
requires-python = ">=3.12,<3.13"
dependencies = [
    "pandas>=2.2,<3",
]

[project.scripts]
market-check = "quant_lab.cli:main"

[dependency-groups]
dev = [
    "pytest>=8,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
